name: teploshchit-lab2
services:
  insulation-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teploshchit}
      POSTGRES_USER: ${POSTGRES_USER:-teploshchit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teploshchit}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - insulation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  insulation-adminer:
    image: adminer:5
    depends_on:
      insulation-postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: insulation-postgres
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
  insulation-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Create .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Create .env first}
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - insulation-minio-data:/data
    restart: unless-stopped
volumes:
  insulation-postgres-data:
  insulation-minio-data:
